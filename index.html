
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAME SHOP</title>
<style>
body {
  background: #101020;
  color: white;
  text-align: center;
  font-family: Arial, sans-serif;
  padding: 30px 15px;
}
button {
  background: #7655ff;
  color: white;
  border: 0;
  border-radius: 15px;
  padding: 18px;
  font-size: 18px;
  margin: 10px;
}
</style>
</head>
<body>
<h1>🎮 GAME SHOP</h1>
<h2>🪙 Монеты: <span id="coins">0</span></h2>
<button onclick="earn()">🪙 Собрать монету</button>
<p>🎁 Магазин призов скоро откроется!</p>
<script>
let coins = 0;
function earn() {
  coins++;
  document.getElementById("coins").textContent = coins;
}
</script>
</body>
</html>
